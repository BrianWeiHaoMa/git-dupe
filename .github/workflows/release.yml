# Publishes the GitHub Release of a pushed tag v<version>, as RELEASING.md describes.
# Before any check runs, the tag is refused unless it is v followed by the version
# Cargo.toml and Cargo.lock name, annotated, and on the default branch, and unless
# CHANGELOG.md has the version's section (`check`). Then the checks of ci.yml run on a
# runner of each platform and architecture a release ships for, and each runner's
# `release_archive` scenarios make its archive (`build`). The Release is published only
# when every runner's checks passed, with the four archives, their checksums, and that
# section as its notes (`publish`).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Cargo.lock is read here because every cargo command below but the archive's build
      # would bring a stale one along silently, and the tag's own sources would then not
      # build with --locked.
      - name: Check that the tag is v followed by the version Cargo.toml and Cargo.lock name
        id: version
        run: |
          version=$(sed -n '/^\[package\]$/,/^\[/s/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cargo.toml's version, '$version', is not <major>.<minor>.<patch>" >&2
            exit 1
          fi
          if [[ $GITHUB_REF_NAME != "v$version" ]]; then
            echo "the tag $GITHUB_REF_NAME is not v followed by Cargo.toml's version $version; a release tag is v$version" >&2
            exit 1
          fi
          locked=$(awk '$0 == "name = \"git-dupe\"" { getline; print; exit }' Cargo.lock) || true
          if [[ $locked != "version = \"$version\"" ]]; then
            echo "Cargo.lock's entry for git-dupe says '$locked' where Cargo.toml says $version; run cargo update -w and commit Cargo.lock with Cargo.toml" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check that the tag is annotated and on the default branch
        run: |
          tag=refs/tags/$GITHUB_REF_NAME
          git fetch --no-tags origin "+$tag:$tag"
          if [[ $(git cat-file -t "$tag") != tag ]]; then
            echo "the tag $GITHUB_REF_NAME is not annotated; a release tag is made with: git tag -a $GITHUB_REF_NAME -m \"git-dupe $VERSION\"" >&2
            exit 1
          fi
          if [[ $(git rev-parse "$tag^{commit}") != "$GITHUB_SHA" ]]; then
            echo "the tag $GITHUB_REF_NAME no longer names the commit $GITHUB_SHA this run was started for" >&2
            exit 1
          fi
          branch=$(git ls-remote --symref origin HEAD | sed -n 's|^ref: refs/heads/\([^\t]*\)\tHEAD$|\1|p')
          if [[ -z $branch ]]; then
            echo "cannot read the default branch of origin" >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$branch"; then
            echo "the tag $GITHUB_REF_NAME names $GITHUB_SHA, which is not on the default branch $branch; a release tag is on $branch" >&2
            exit 1
          fi

      - name: Cut the version's section out of CHANGELOG.md as the notes
        run: |
          status=0
          awk -v heading="## [$VERSION] - " '
            index($0, "## ") == 1 {
              if (inside) exit
              rest = substr($0, length(heading) + 1)
              inside = index($0, heading) == 1 && rest ~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/
              if (inside) found = 1
              next
            }
            !inside { next }
            /^[ \t]*$/ { if (started) blank++; next }
            { while (blank > 0) { print ""; blank-- }; print; started = 1 }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || status=$?
          if (( status != 0 )); then
            echo "CHANGELOG.md has no section headed '## [$VERSION] - <YYYY-MM-DD>'" >&2
            exit 1
          fi
          if [[ ! -s $RUNNER_TEMP/notes.md ]]; then
            echo "CHANGELOG.md's section for $VERSION is empty" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Keep the notes for the publishing job
        uses: actions/upload-artifact@v7
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  # Each archive is made by the scenarios on a runner of the platform and architecture
  # its suffix names, never cross-built, so that an archive exists only where the checks
  # passed on its platform (P3); the suffix and the extension are the expectation that
  # pins it there.
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            suffix: linux-x86_64
            extension: tar
            timeout: 60
          # A macOS runner is slower, the Intel one most, and builds the two Git
          # releases itself on a cache miss.
          - runner: macos-26
            suffix: macos-arm64
            extension: tar
            timeout: 90
          - runner: macos-26-intel
            suffix: macos-x86_64
            extension: tar
            timeout: 90
          # The label, never windows-latest, which moves to whatever image GitHub promotes;
          # four processors, and a MinGit unpacked rather than built on a cache miss.
          - runner: windows-2025
            suffix: windows-x86_64
            extension: zip
            # The first run on this runner passed 120 minutes in the scenarios and was cancelled.
            timeout: 240
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      EXTENSION: ${{ matrix.extension }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # Every file in a private repository stands deeper than its counterpart in .git, and
      # the runner's own temporary directory is long enough to fail the deepest scenarios.
      - name: Keep temporary files in a short directory
        if: runner.os == 'Windows'
        run: |
          mkdir -p /c/t
          echo 'TMP=C:\t' >> "$GITHUB_ENV"
          echo 'TEMP=C:\t' >> "$GITHUB_ENV"

      # macOS has man, and its Command Line Tools the zlib headers; Windows needs neither.
      - name: Install man and the zlib headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends man-db zlib1g-dev

      - name: Read the oldest and the newest listed Git release
        id: releases
        run: |
          selection=$(sed -n '/pub const LISTED/,/^];/p' tests/scenarios/harness/releases.rs \
            | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' | tr -d '"' | sed -n '1p;$p' | paste -sd, -) || true
          if ! [[ $selection =~ ^[0-9]+\.[0-9]+\.[0-9]+,[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "cannot read the oldest and the newest release of LISTED in tests/scenarios/harness/releases.rs: '$selection'" >&2
            exit 1
          fi
          echo "selection=$selection"
          echo "selection=$selection" >> "$GITHUB_OUTPUT"
          # Cache keys forbid commas; the scenario selection requires them.
          echo "cache-selection=${selection//,/-}" >> "$GITHUB_OUTPUT"

      # The same key as ci.yml's: a tag's run restores what a run on the default branch
      # saved on the same image and architecture.
      - name: Restore the built Git releases
        uses: actions/cache@v6
        with:
          path: gits
          key: gits-${{ matrix.runner }}-${{ runner.arch }}-${{ steps.releases.outputs.cache-selection }}-${{ hashFiles('tests/scenarios/harness/releases.rs', 'tests/scenarios/harness/provision.rs') }}

      - name: Format
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit checks
        run: cargo test --bin git-dupe

      # As in ci.yml: every scenario but `scale`, whose counted Git runs among 100,000
      # files and one-second bound the delivery check runs before the tag. Its
      # `release_archive` scenarios make target/release/git-dupe-<version>-<suffix>.<extension>
      # with its .sha256.
      - name: Scenarios under the oldest and the newest listed release
        env:
          GIT_DUPE_CHECK_RELEASES: ${{ steps.releases.outputs.selection }}
        run: cargo test --test scenarios -- --skip scale

      # The scenarios wrote the .sha256 and this step writes none, so that the three
      # platforms have one source for its line. From the archive's own directory, because
      # the line names it by its bare name; shasum stands in on a Mac without sha256sum.
      - name: Check the archive's checksum
        run: |
          cd target/release
          archive=git-dupe-$VERSION-${{ matrix.suffix }}.$EXTENSION
          for file in "$archive" "$archive.sha256"; do
            if [[ ! -f $file ]]; then
              echo "the scenarios left no file at target/release/$file" >&2
              exit 1
            fi
          done
          if command -v sha256sum > /dev/null; then
            sha256sum -c "$archive.sha256"
          else
            shasum -a 256 -c "$archive.sha256"
          fi

      - name: Keep the archive and its checksum for the publishing job
        uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.suffix }}
          path: |
            target/release/git-dupe-${{ env.VERSION }}-${{ matrix.suffix }}.${{ matrix.extension }}
            target/release/git-dupe-${{ env.VERSION }}-${{ matrix.suffix }}.${{ matrix.extension }}.sha256
          if-no-files-found: error

  # Runs only when every build passed, and publishes the eight files in one command, so
  # that a Release never holds fewer; the loop names each archive, never a glob, so that
  # one made under a wrong name is not published.
  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Gather the archives and their checksums
        uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          merge-multiple: true
          path: release

      - name: Gather the notes
        uses: actions/download-artifact@v8
        with:
          name: notes
          path: ${{ runner.temp }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          files=()
          for suffix in linux-x86_64.tar macos-arm64.tar macos-x86_64.tar windows-x86_64.zip; do
            archive=git-dupe-$VERSION-$suffix
            shasum -a 256 -c "$archive.sha256"
            files+=("$archive" "$archive.sha256")
          done
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" "${files[@]}"
